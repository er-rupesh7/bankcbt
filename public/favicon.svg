<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Sharp Royal Blue Shield -->
  <path d="M 32 4 L 56 12 C 56 36 46 52 32 60 C 18 52 8 36 8 12 Z" fill="url(#shieldGrad)" />
  
  <!-- Subtle Stopwatch Dial Arc -->
  <circle cx="32" cy="30" r="17" fill="none" stroke="#60A5FA" stroke-width="2.5" stroke-dasharray="8,4" />
  
  <!-- Stopwatch Top Stem/Button -->
  <rect x="29.5" y="7" width="5" height="5" rx="1.5" fill="#FFFFFF" />

  <!-- High-Contrast Bold Emerald/White Selection Checkmark -->
  <path d="M 22 30 L 29 37 L 44 20" fill="none" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 22 30 L 29 37 L 44 20" fill="none" stroke="url(#checkGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Speed Pulse Dot -->
  <circle cx="45" cy="19" r="3" fill="#FBBF24" />
</svg>
